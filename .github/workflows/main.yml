name: 🚀 Deploy website to FTP (ручной запуск)

on:
  # Деплой ТОЛЬКО по нажатию кнопки: вкладка Actions → этот workflow → «Run workflow».
  # Автозапуск по push отключён намеренно.
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Путь на сервере, куда заливать файлы (обязательно со слешем в конце)
        server-dir: /
        # Папка в репозитории, которую нужно залить (по умолчанию вся)
        local-dir: ./
        # Исключаем служебные файлы, чтобы не заливать их на хостинг
        exclude: |
          **/.git*
          **/.git*/**
          **/work/**
          **/README.md
          
